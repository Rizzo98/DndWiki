[project]
name = "dnd-common"
version = "0.1.0"
description = "Shared layer for DnD Wiki backend services (config, auth, events, db)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyJWT>=2.8",
    "cryptography>=41.0",  # required by PyJWT for RS256/ES256 JWT verification
    "httpx>=0.27",
    "aio-pika>=9.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dnd_common*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: dependency injection in argument defaults is intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
