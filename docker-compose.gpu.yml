# ============================================================================
# DnD Wiki — GPU override for the transcription service.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Requirements:
#   - Docker Desktop with WSL2 backend + NVIDIA driver support, or
#     a Linux engine with the nvidia-container-toolkit installed.
#   - The base image switch pulls PyTorch CUDA wheels (~ several GB).
# ============================================================================

services:
  transcription-service:
    build:
      args:
        # PyTorch with CUDA 12.1 + cuDNN 8 (matches WhisperX/torch requirements)
        BASE_IMAGE: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
