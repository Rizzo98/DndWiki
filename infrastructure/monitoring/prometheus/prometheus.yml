# Prometheus — scrape config for the DnD Wiki dev stack (monitoring profile).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application services expose /metrics (FastAPI prometheus-client)
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - user-service:8000
          - campaign-service:8000
          - session-service:8000
          - transcription-service:8000
          - speaker-service:8000
          - content-service:8000
          - wiki-service:8000
          - search-service:8000
          - notification-service:8000

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq-exporter:9419"]

  - job_name: minio
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster
