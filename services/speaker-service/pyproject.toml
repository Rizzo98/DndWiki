[project]
name = "speaker-service"
version = "0.1.0"
description = "DnD Wiki speaker identification: ECAPA-TDNN embeddings vs Qdrant voiceprints"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "aio-pika>=9.4",
    "aioboto3>=13.0",
    "httpx>=0.27",
    "qdrant-client>=1.9",
    "speechbrain>=1.0",
    "torch>=2.3",
    "torchaudio>=2.3",
    # torchaudio 2.8 loads audio via torchcodec (bundled ffmpeg) — required
    # for decoding m4a/aac/webm/mp3 recordings
    "torchcodec>=0.7",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
