[project]
name = "user-service"
version = "0.2.0"
description = "DnD Wiki user profiles, speaker identities and voiceprint enrollment"
requires-python = ">=3.12"
# dnd-common is installed separately (pip install -e libs/python/dnd_common)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "aio-pika>=9.4",
    # Required by FastAPI for Form/File endpoints (voice enroll, avatar upload)
    "python-multipart>=0.0.9",
    "aioboto3>=13.0",
    "qdrant-client>=1.9",
]

# Heavy ML dependencies (torch + speechbrain) are optional: the API serves
# profiles without them; only voiceprint enrollment needs the embedder
# (installed in the image via `pip install -e .[ml]`).
[project.optional-dependencies]
ml = [
    "speechbrain>=1.0",
    "torch>=2.3",
    "torchaudio>=2.3",
    # torchaudio 2.8 loads audio via torchcodec (bundled ffmpeg)
    "torchcodec>=0.7",
    "librosa>=0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: dependency injection in argument defaults is intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
